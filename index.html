<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Audio Analyzer | P.2050</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #111111;
            --neon-green: #00ff41;
            --neon-red: #ff003c;
            --neon-blue: #00e5ff;
            --neon-yellow: #ffea00;
            --text-muted: #666666;
            --border-color: #222222;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .dashboard {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; }
        
        .readouts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .readout-box { 
            background: #000;
            padding: 15px;
            border: 1px solid var(--border-color);
            text-align: center; 
            position: relative;
        }
        .readout-value { font-size: 3rem; font-weight: bold; margin: 10px 0; }
        .readout-label { color: var(--text-muted); text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }
        .warning { color: var(--neon-red); }
        .alert-freq { color: var(--neon-yellow); }

        .canvas-container {
            position: relative;
            margin-bottom: 20px;
            background: #000;
            border: 1px solid var(--border-color);
        }

        .canvas-title {
            position: absolute;
            top: 10px;
            left: 10px;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            background: rgba(0,0,0,0.7);
            padding: 2px 5px;
            z-index: 10;
        }

        canvas {
            width: 100%;
            height: 250px; 
            display: block;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background: #000;
            padding: 15px;
            border: 1px solid var(--border-color);
        }

        .btn {
            background: transparent;
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 8px 20px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn:hover:not(:disabled), .btn.active { background: var(--neon-green); color: #000; }
        .btn:disabled { border-color: var(--text-muted); color: var(--text-muted); cursor: not-allowed; }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group label { color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; }
        
        input[type=range] {
            -webkit-appearance: none;
            background: var(--border-color);
            height: 4px;
            outline: none;
            width: 150px;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            background: var(--neon-green);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <h1>SYS.AUDIO_ANALYZER // LOG RTA (PRO)</h1>
            <span id="status" style="color: var(--text-muted)">[ OFFLINE ]</span>
        </div>

        <div class="readouts">
            <div class="readout-box">
                <div class="readout-label">Nivel RMS (SPL)</div>
                <div class="readout-value" id="current-db">--</div>
            </div>
            <div class="readout-box" style="border-color: var(--neon-yellow);">
                <div class="readout-label">Pico Problemático (Feedback)</div>
                <div class="readout-value alert-freq" id="dom-freq">-- Hz</div>
            </div>
        </div>

        <!-- RTA Logarítmico Optimizado -->
        <div class="canvas-container">
            <div class="canvas-title">RTA Logarítmico (20Hz - 20kHz)</div>
            <canvas id="spectrumCanvas"></canvas>
        </div>

        <div class="controls">
            <div class="control-group">
                <button class="btn" id="btn-start">Start RTA</button>
                <button class="btn" id="btn-stop" disabled>Stop</button>
                <button class="btn" id="btn-reset">Reset Peaks</button>
            </div>

            <div class="control-group">
                <label>Tiempo Integ.:</label>
                <button class="btn active" id="btn-fast">Fast</button>
                <button class="btn" id="btn-slow">Slow</button>
            </div>
            
            <div class="control-group">
                <label for="offset-slider">Ganancia (+dB):</label>
                <input type="range" id="offset-slider" min="50" max="150" value="100">
                <span id="offset-val" style="color: var(--neon-green)">100</span>
            </div>
        </div>
    </div>

    <script>
        let audioContext, mediaStreamSource, analyser, animationId;
        let isRunning = false;

        const fftSize = 4096;
        let timeDataArray, freqDataArray, peakFreqArray;
        let smoothedRMS = 0;
        let sampleRate = 44100; 
        
        // Rango de RTA y Cache Logarítmico
        const MIN_FREQ = 20; 
        const MAX_FREQ = 20000;
        let logXArray = []; // RAM Cache para coordenadas X
        let spectrumGradient; // Cache para colores

        const RESPONSE_FAST = 0.8; 
        const RESPONSE_SLOW = 0.1;
        let currentResponse = RESPONSE_FAST;

        // Limitador de FPS (~45 fps para no quemar la CPU)
        let lastFrameTime = 0;
        const fpsInterval = 1000 / 45;

        // Elementos del DOM
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnReset = document.getElementById('btn-reset');
        const btnFast = document.getElementById('btn-fast');
        const btnSlow = document.getElementById('btn-slow');
        const statusEl = document.getElementById('status');
        const currentDbEl = document.getElementById('current-db');
        const domFreqEl = document.getElementById('dom-freq');
        const slider = document.getElementById('offset-slider');
        const offsetVal = document.getElementById('offset-val');
        
        const spectrumCanvas = document.getElementById('spectrumCanvas');
        const specCtx = spectrumCanvas.getContext('2d');
        
        // Función matemática base
        function getLogX(freq) {
            const minLog = Math.log10(MIN_FREQ);
            const maxLog = Math.log10(MAX_FREQ);
            const freqLog = Math.log10(Math.max(freq, MIN_FREQ));
            return ((freqLog - minLog) / (maxLog - minLog)) * spectrumCanvas.width;
        }

        // PRECALCULAR DATOS PESADOS (Optimization)
        function precomputeData() {
            if (!analyser) return;
            const binSize = sampleRate / fftSize;
            logXArray = new Float32Array(analyser.frequencyBinCount);
            
            // Llenar RAM con las coordenadas en vez de calcularlas en vivo
            for (let i = 0; i < analyser.frequencyBinCount; i++) {
                logXArray[i] = getLogX(i * binSize);
            }

            // Preparar el gradiente de color vectorial
            const graphHeight = spectrumCanvas.height - 25;
            spectrumGradient = specCtx.createLinearGradient(0, graphHeight, 0, 0);
            spectrumGradient.addColorStop(0, '#00ff41');   // Verde
            spectrumGradient.addColorStop(0.7, '#00ff41'); // Verde
            spectrumGradient.addColorStop(0.85, '#ffea00'); // Amarillo
            spectrumGradient.addColorStop(1, '#ff003c');   // Rojo
        }

        function resizeCanvases() {
            spectrumCanvas.width = spectrumCanvas.parentElement.clientWidth;
            spectrumCanvas.height = 250; 
            precomputeData(); // Recalcular cache al redimensionar
            if(!isRunning) drawSpectrumLog(); // Dibujar grilla vacía
        }
        window.addEventListener('resize', resizeCanvases);

        // Listeners UI
        let calibrationOffset = parseInt(slider.value);
        slider.addEventListener('input', (e) => {
            calibrationOffset = parseInt(e.target.value);
            offsetVal.innerText = calibrationOffset;
        });

        btnReset.addEventListener('click', () => {
            if(peakFreqArray) peakFreqArray.fill(0);
        });

        btnFast.addEventListener('click', () => {
            currentResponse = RESPONSE_FAST;
            btnFast.classList.add('active');
            btnSlow.classList.remove('active');
            if (analyser) analyser.smoothingTimeConstant = 0.2;
        });

        btnSlow.addEventListener('click', () => {
            currentResponse = RESPONSE_SLOW;
            btnSlow.classList.add('active');
            btnFast.classList.remove('active');
            if (analyser) analyser.smoothingTimeConstant = 0.8;
        });

        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                sampleRate = audioContext.sampleRate; 
                
                mediaStreamSource = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                
                analyser.fftSize = fftSize;
                analyser.smoothingTimeConstant = currentResponse === RESPONSE_FAST ? 0.2 : 0.8;
                
                mediaStreamSource.connect(analyser);
                
                timeDataArray = new Float32Array(analyser.fftSize);
                freqDataArray = new Uint8Array(analyser.frequencyBinCount);
                peakFreqArray = new Uint8Array(analyser.frequencyBinCount);
                
                precomputeData(); // Iniciar optimización
                
                isRunning = true;
                statusEl.innerText = '[ ONLINE / MIC ACTIVE ]';
                statusEl.style.color = 'var(--neon-green)';
                
                btnStart.disabled = true;
                btnStop.disabled = false;
                
                requestAnimationFrame(updateRoutine);
                
            } catch (err) {
                console.error('Error:', err);
                alert('Asegúrate de conceder permisos de micrófono.');
            }
        }

        function stopAudio() {
            if (audioContext) audioContext.close();
            isRunning = false;
            statusEl.innerText = '[ OFFLINE ]';
            statusEl.style.color = 'var(--text-muted)';
            btnStart.disabled = false;
            btnStop.disabled = true;
        }

        // BUCLE PRINCIPAL
        function updateRoutine(timestamp) {
            if (!isRunning) return;
            
            // Programar el siguiente cuadro
            requestAnimationFrame(updateRoutine);

            // LIMITADOR FPS: Saltar cuadro si es muy rápido
            const elapsed = timestamp - lastFrameTime;
            if (elapsed < fpsInterval) return;
            lastFrameTime = timestamp - (elapsed % fpsInterval);

            // 1. CÁLCULO RMS (Rápido)
            analyser.getFloatTimeDomainData(timeDataArray);
            let sumSquares = 0.0;
            for (let i = 0; i < timeDataArray.length; i++) {
                sumSquares += timeDataArray[i] * timeDataArray[i];
            }
            let currentRMS = Math.sqrt(sumSquares / timeDataArray.length);
            smoothedRMS = (currentRMS * currentResponse) + (smoothedRMS * (1 - currentResponse));

            let dbValue = smoothedRMS > 0 ? 20 * Math.log10(smoothedRMS) + calibrationOffset : 0;
            if (dbValue < 0) dbValue = 0;
            
            // Modificación rápida del DOM mediante toggle (más óptimo)
            currentDbEl.innerText = dbValue.toFixed(1);
            currentDbEl.classList.toggle('warning', dbValue > 95);

            // 2. BÚSQUEDA DE FRECUENCIA DOMINANTE
            analyser.getByteFrequencyData(freqDataArray);
            
            let maxFreqVal = 0;
            let dominantIndex = 0;
            
            for (let i = 0; i < analyser.frequencyBinCount; i++) {
                if (freqDataArray[i] > maxFreqVal) {
                    maxFreqVal = freqDataArray[i];
                    dominantIndex = i;
                }
            }

            const binSize = sampleRate / fftSize;
            const dominantFrequency = dominantIndex * binSize;

            if (maxFreqVal > 80 && dominantFrequency > MIN_FREQ) { 
                domFreqEl.innerText = Math.round(dominantFrequency) + " Hz";
                domFreqEl.classList.toggle('warning', maxFreqVal > 220);
                domFreqEl.classList.toggle('alert-freq', maxFreqVal <= 220);
            } else {
                domFreqEl.innerText = "-- Hz";
                domFreqEl.classList.remove('warning');
                domFreqEl.classList.add('alert-freq');
            }

            // 3. RENDERIZADO VISUAL
            drawSpectrumLog();
        }

        // MOTOR DE DIBUJO OPTIMIZADO
        function drawSpectrumLog() {
            specCtx.fillStyle = '#000';
            specCtx.fillRect(0, 0, spectrumCanvas.width, spectrumCanvas.height);
            
            const graphHeight = spectrumCanvas.height - 25; 

            // -- GUIAS DE FONDO --
            specCtx.beginPath();
            specCtx.strokeStyle = '#222';
            specCtx.lineWidth = 1;
            specCtx.fillStyle = '#666';
            specCtx.font = '10px Courier New';
            specCtx.textAlign = 'center';

            const referenceFreqs = [60, 125, 250, 500, 1000, 2000, 4000, 8000, 16000];
            const labels = ['60', '125', '250', '500', '1k', '2k', '4k', '8k', '16k'];

            for(let j=0; j<referenceFreqs.length; j++) {
                // Para las guias seguimos usando la función porque son pocas
                let posX = getLogX(referenceFreqs[j]);
                specCtx.moveTo(posX, 0);
                specCtx.lineTo(posX, graphHeight);
                specCtx.fillText(labels[j], posX, spectrumCanvas.height - 5);
            }
            specCtx.stroke();

            if (!isRunning) return; // Si está apagado, terminar aquí

            const binSize = sampleRate / fftSize;

            // -- DIBUJO DE ONDA CONTINUA (BATCHING) --
            specCtx.fillStyle = spectrumGradient;
            specCtx.beginPath();
            specCtx.moveTo(0, graphHeight); // Empezar trazado
            
            let peakPath = new Path2D(); // Trazado separado para la línea azul
            let isFirstPeakPoint = true;
            
            let lastX = -1;
            let bucketVal = 0;
            let bucketPeak = 0;
            
            for (let i = 1; i < analyser.frequencyBinCount; i++) {
                const hz = i * binSize;
                if (hz < MIN_FREQ || hz > MAX_FREQ) continue;

                const value = freqDataArray[i];
                
                // Actualizar Peak Hold
                if (value > peakFreqArray[i]) peakFreqArray[i] = value;
                else peakFreqArray[i] = Math.max(0, peakFreqArray[i] - 1.5);

                // Agrupación (Binning) por píxel X de la pantalla
                const x = Math.round(logXArray[i]);
                
                if (x === lastX) {
                    // Si varias frecuencias caen en el mismo píxel, tomamos la más fuerte
                    if (value > bucketVal) bucketVal = value;
                    if (peakFreqArray[i] > bucketPeak) bucketPeak = peakFreqArray[i];
                } else {
                    // Si cambiamos de píxel, dibujamos el resultado del píxel anterior
                    if (lastX !== -1) {
                        const h = (bucketVal / 255) * graphHeight;
                        specCtx.lineTo(lastX, graphHeight - h);
                        
                        const ph = (bucketPeak / 255) * graphHeight;
                        if (isFirstPeakPoint) {
                            peakPath.moveTo(lastX, graphHeight - ph);
                            isFirstPeakPoint = false;
                        } else {
                            peakPath.lineTo(lastX, graphHeight - ph);
                        }
                    }
                    // Reiniciar acumulador
                    lastX = x;
                    bucketVal = value;
                    bucketPeak = peakFreqArray[i];
                }
            }
            
            // Completar el último punto
            if (lastX !== -1) {
                const h = (bucketVal / 255) * graphHeight;
                specCtx.lineTo(lastX, graphHeight - h);
                const ph = (bucketPeak / 255) * graphHeight;
                peakPath.lineTo(lastX, graphHeight - ph);
            }
            
            // Cerrar el polígono de espectro
            specCtx.lineTo(lastX, graphHeight); 
            specCtx.fill(); // Rellenar todo de un solo golpe GPU
            
            // Pintar la línea de Picos (Hold)
            specCtx.strokeStyle = '#00e5ff'; // neon-blue
            specCtx.lineWidth = 1.5;
            specCtx.stroke(peakPath);
        }

        btnStart.addEventListener('click', initAudio);
        btnStop.addEventListener('click', stopAudio);
        
        // Inicializar vistas
        resizeCanvases();
    </script>
</body>
</html>
