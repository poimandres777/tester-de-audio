<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Audio Analyzer | P.2050</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #111111;
            --neon-green: #00ff41;
            --neon-red: #ff003c;
            --neon-blue: #00e5ff;
            --text-muted: #666666;
            --border-color: #222222;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .dashboard {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; }
        
        .readouts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .readout-box { 
            background: #000;
            padding: 15px;
            border: 1px solid var(--border-color);
            text-align: center; 
        }
        .readout-value { font-size: 3.5rem; font-weight: bold; margin: 10px 0; }
        .readout-label { color: var(--text-muted); text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }
        .warning { color: var(--neon-red); }

        .canvas-container {
            position: relative;
            margin-bottom: 20px;
            background: #000;
            border: 1px solid var(--border-color);
        }

        .canvas-title {
            position: absolute;
            top: 10px;
            left: 10px;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            background: rgba(0,0,0,0.7);
            padding: 2px 5px;
        }

        canvas {
            width: 100%;
            height: 200px;
            display: block;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background: #000;
            padding: 15px;
            border: 1px solid var(--border-color);
        }

        .btn {
            background: transparent;
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 8px 20px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn:hover:not(:disabled), .btn.active { background: var(--neon-green); color: #000; }
        .btn:disabled { border-color: var(--text-muted); color: var(--text-muted); cursor: not-allowed; }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group label { color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; }
        
        input[type=range] {
            -webkit-appearance: none;
            background: var(--border-color);
            height: 4px;
            outline: none;
            width: 150px;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            background: var(--neon-green);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <h1>SYS.AUDIO_ANALYZER // LIVE</h1>
            <span id="status" style="color: var(--text-muted)">[ OFFLINE ]</span>
        </div>

        <div class="readouts">
            <div class="readout-box">
                <div class="readout-label">Nivel Actual (RMS)</div>
                <div class="readout-value" id="current-db">--</div>
            </div>
            <div class="readout-box">
                <div class="readout-label">Pico Máximo (Max Peak)</div>
                <div class="readout-value" id="peak-db">--</div>
            </div>
        </div>

        <!-- Gráfico de Espectro de Frecuencias -->
        <div class="canvas-container">
            <div class="canvas-title">Espectro de Frecuencias (FFT) + Peak Hold</div>
            <canvas id="spectrumCanvas"></canvas>
        </div>

        <!-- Gráfico de Historial SPL -->
        <div class="canvas-container">
            <div class="canvas-title">Historial SPL (Tiempo Real)</div>
            <canvas id="historyCanvas"></canvas>
        </div>

        <div class="controls">
            <div class="control-group">
                <button class="btn" id="btn-start">Iniciar</button>
                <button class="btn" id="btn-stop" disabled>Detener</button>
                <button class="btn" id="btn-reset">Reset Peaks</button>
            </div>

            <div class="control-group">
                <label>Muestreo (Response):</label>
                <button class="btn active" id="btn-fast">Fast</button>
                <button class="btn" id="btn-slow">Slow</button>
            </div>
            
            <div class="control-group">
                <label for="offset-slider">Calibración (+dB):</label>
                <input type="range" id="offset-slider" min="50" max="150" value="100">
                <span id="offset-val" style="color: var(--neon-green)">100</span>
            </div>
        </div>
    </div>

    <script>
        let audioContext, mediaStreamSource, analyser, animationId;
        let isRunning = false;

        // Configuraciones de Audio
        const fftSize = 4096; // Alta resolución de frecuencias
        let timeDataArray, freqDataArray, peakFreqArray;
        let dbHistory = [];
        const maxHistoryLength = 300;
        let peakDB = -Infinity;
        let smoothedRMS = 0;

        // Constantes de Muestreo (Filtro de media móvil exponencial)
        // Fast reacciona rápido a transitorios, Slow hace un promedio más largo
        const RESPONSE_FAST = 0.8; 
        const RESPONSE_SLOW = 0.1;
        let currentResponse = RESPONSE_FAST;

        // Elementos DOM
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnReset = document.getElementById('btn-reset');
        const btnFast = document.getElementById('btn-fast');
        const btnSlow = document.getElementById('btn-slow');
        const statusEl = document.getElementById('status');
        const currentDbEl = document.getElementById('current-db');
        const peakDbEl = document.getElementById('peak-db');
        const slider = document.getElementById('offset-slider');
        const offsetVal = document.getElementById('offset-val');
        
        // Canvas Setup
        const historyCanvas = document.getElementById('historyCanvas');
        const histCtx = historyCanvas.getContext('2d');
        const spectrumCanvas = document.getElementById('spectrumCanvas');
        const specCtx = spectrumCanvas.getContext('2d');
        
        function resizeCanvases() {
            const width = historyCanvas.parentElement.clientWidth;
            historyCanvas.width = width;
            historyCanvas.height = 200;
            spectrumCanvas.width = width;
            spectrumCanvas.height = 200;
        }
        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        // Controles de Interfaz
        let calibrationOffset = parseInt(slider.value);
        slider.addEventListener('input', (e) => {
            calibrationOffset = parseInt(e.target.value);
            offsetVal.innerText = calibrationOffset;
        });

        btnReset.addEventListener('click', () => {
            peakDB = -Infinity;
            peakDbEl.innerText = '--';
            peakDbEl.classList.remove('warning');
            if(peakFreqArray) peakFreqArray.fill(0); // Resetear picos del espectro
        });

        btnFast.addEventListener('click', () => {
            currentResponse = RESPONSE_FAST;
            btnFast.classList.add('active');
            btnSlow.classList.remove('active');
            if (analyser) analyser.smoothingTimeConstant = 0.2;
        });

        btnSlow.addEventListener('click', () => {
            currentResponse = RESPONSE_SLOW;
            btnSlow.classList.add('active');
            btnFast.classList.remove('active');
            if (analyser) analyser.smoothingTimeConstant = 0.8;
        });

        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                mediaStreamSource = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                
                analyser.fftSize = fftSize;
                analyser.smoothingTimeConstant = currentResponse === RESPONSE_FAST ? 0.2 : 0.8;
                
                mediaStreamSource.connect(analyser);
                
                timeDataArray = new Float32Array(analyser.fftSize);
                freqDataArray = new Uint8Array(analyser.frequencyBinCount);
                peakFreqArray = new Uint8Array(analyser.frequencyBinCount);
                
                isRunning = true;
                statusEl.innerText = '[ ONLINE / TRACKING ]';
                statusEl.style.color = 'var(--neon-green)';
                
                btnStart.disabled = true;
                btnStop.disabled = false;
                
                updateRoutine();
                
            } catch (err) {
                console.error('Error:', err);
                alert('Permiso de micrófono denegado. Asegúrate de estar en HTTPS y permitir el acceso.');
            }
        }

        function stopAudio() {
            if (audioContext) audioContext.close();
            cancelAnimationFrame(animationId);
            isRunning = false;
            
            statusEl.innerText = '[ OFFLINE ]';
            statusEl.style.color = 'var(--text-muted)';
            btnStart.disabled = false;
            btnStop.disabled = true;
        }

        function updateRoutine() {
            if (!isRunning) return;

            // 1. OBTENER Y CALCULAR RMS (Nivel SPL)
            analyser.getFloatTimeDomainData(timeDataArray);
            let sumSquares = 0.0;
            for (let i = 0; i < timeDataArray.length; i++) {
                sumSquares += timeDataArray[i] * timeDataArray[i];
            }
            let currentRMS = Math.sqrt(sumSquares / timeDataArray.length);
            
            // Aplicar suavizado según la opción Fast/Slow
            smoothedRMS = (currentRMS * currentResponse) + (smoothedRMS * (1 - currentResponse));

            let dbValue = 0;
            if (smoothedRMS > 0) {
                dbValue = 20 * Math.log10(smoothedRMS) + calibrationOffset;
            }
            if (dbValue < 0) dbValue = 0;

            if (dbValue > peakDB) peakDB = dbValue;

            // Actualizar Textos
            currentDbEl.innerText = dbValue.toFixed(1);
            peakDbEl.innerText = peakDB.toFixed(1);
            
            if (dbValue > 95) currentDbEl.classList.add('warning');
            else currentDbEl.classList.remove('warning');
            if (peakDB > 95) peakDbEl.classList.add('warning');

            // Actualizar Historial SPL
            dbHistory.push(dbValue);
            if (dbHistory.length > maxHistoryLength) dbHistory.shift();

            // 2. OBTENER DATOS DE FRECUENCIA (Espectrómetro)
            analyser.getByteFrequencyData(freqDataArray);

            drawHistory();
            drawSpectrum();

            animationId = requestAnimationFrame(updateRoutine);
        }

        function drawHistory() {
            histCtx.fillStyle = '#000';
            histCtx.fillRect(0, 0, historyCanvas.width, historyCanvas.height);
            if (dbHistory.length === 0) return;

            // Cuadrícula
            histCtx.strokeStyle = '#222';
            histCtx.lineWidth = 1;
            histCtx.beginPath();
            for (let i = 0; i < historyCanvas.height; i += 40) {
                histCtx.moveTo(0, i);
                histCtx.lineTo(historyCanvas.width, i);
            }
            histCtx.stroke();

            histCtx.beginPath();
            histCtx.lineWidth = 2;
            const sliceWidth = historyCanvas.width / maxHistoryLength;
            let x = 0;

            for (let i = 0; i < dbHistory.length; i++) {
                const db = dbHistory[i];
                const y = historyCanvas.height - (db / 130) * historyCanvas.height;
                
                if (i === 0) histCtx.moveTo(x, y);
                else histCtx.lineTo(x, y);

                histCtx.strokeStyle = db > 95 ? 'var(--neon-red)' : 'var(--neon-green)';
                x += sliceWidth;
            }
            histCtx.stroke();
        }

        function drawSpectrum() {
            specCtx.fillStyle = '#000';
            specCtx.fillRect(0, 0, spectrumCanvas.width, spectrumCanvas.height);
            
            // Limitamos a las frecuencias útiles para no dibujar espacio vacío al final (hasta aprox 16-20kHz)
            const binCount = Math.floor(analyser.frequencyBinCount * 0.8); 
            const barWidth = spectrumCanvas.width / binCount;
            let x = 0;

            for (let i = 0; i < binCount; i++) {
                const value = freqDataArray[i];
                
                // Actualizar Peak Hold (Retención de picos)
                if (value > peakFreqArray[i]) {
                    peakFreqArray[i] = value;
                } else {
                    // Decaimiento lento del pico (efecto gravedad)
                    peakFreqArray[i] = Math.max(0, peakFreqArray[i] - 1.5);
                }

                // Dibujar banda actual (Azul neón / Verde según intensidad)
                const percent = value / 255;
                const height = percent * spectrumCanvas.height;
                const y = spectrumCanvas.height - height;
                
                // Color degradado dependiendo de la amplitud
                specCtx.fillStyle = value > 210 ? 'var(--neon-red)' : 'var(--neon-green)';
                specCtx.globalAlpha = 0.7;
                specCtx.fillRect(x, y, barWidth > 1 ? barWidth - 0.5 : 1, height);
                specCtx.globalAlpha = 1.0;

                // Dibujar línea de Peak Hold (Punto flotante superior)
                const peakPercent = peakFreqArray[i] / 255;
                const peakY = spectrumCanvas.height - (peakPercent * spectrumCanvas.height);
                
                specCtx.fillStyle = 'var(--neon-blue)';
                specCtx.fillRect(x, peakY, barWidth > 1 ? barWidth - 0.5 : 1, 2);

                x += barWidth;
            }
        }

        btnStart.addEventListener('click', initAudio);
        btnStop.addEventListener('click', stopAudio);
        
        drawHistory();
        drawSpectrum();
    </script>
</body>
</html>
